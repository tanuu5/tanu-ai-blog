<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>紅夜抄 〜 Crimson Night Fragment.</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Old+Mincho:wght@700&display=swap');
  :root{
    --gold:#d8a94e; --gold-dim:#9a7a3a; --scarlet:#c5283d; --ink:#16060d;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 700px at 50% -10%, #3a0d1c 0%, #1c0613 45%, #0c0309 100%);
    color:#e9d9b8;
    font-family:'Shippori Mincho','Yu Mincho','Hiragino Mincho ProN',serif;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  #stage{display:flex;gap:18px;align-items:stretch;padding:14px}
  #frame{
    position:relative;border-radius:6px;padding:8px;
    background:linear-gradient(160deg,#3d1020,#1b0712 60%,#2a0b18);
    box-shadow:0 0 0 1px #5b2434, 0 0 0 3px #14040c, 0 0 42px rgba(197,40,61,.35), inset 0 0 18px rgba(0,0,0,.8);
  }
  #frame::before{
    content:"";position:absolute;inset:3px;border:1px solid var(--gold-dim);
    border-radius:4px;pointer-events:none;opacity:.7;
  }
  canvas#game{display:block;background:#0d0a1d;border-radius:2px}
  #panel{
    width:236px;display:flex;flex-direction:column;gap:10px;
    padding:16px 16px 12px;border-radius:6px;
    background:linear-gradient(175deg,#2b0a17,#170410 70%);
    box-shadow:0 0 0 1px #5b2434, inset 0 0 24px rgba(0,0,0,.7);
  }
  #panel h1{
    font-family:'Zen Old Mincho','Shippori Mincho',serif;
    font-size:21px;letter-spacing:.12em;color:var(--gold);
    text-shadow:0 0 14px rgba(216,169,78,.45);
    border-bottom:1px solid var(--gold-dim);padding-bottom:8px;
  }
  #panel h1 small{display:block;font-size:10px;letter-spacing:.28em;color:#b78b54;margin-top:4px}
  .row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;letter-spacing:.08em}
  .row .lbl{color:#bf8e5a;font-size:11px;letter-spacing:.22em}
  .row .val{font-size:16px;color:#f2e3c2;font-variant-numeric:tabular-nums}
  .row .val.big{font-size:19px;color:#ffd98a;text-shadow:0 0 10px rgba(255,200,120,.3)}
  #lives,#bombs{font-size:15px;letter-spacing:2px}
  #lives{color:#ff5d7a;text-shadow:0 0 8px rgba(255,80,110,.6)}
  #bombs{color:#6fd3a0;text-shadow:0 0 8px rgba(110,220,160,.5)}
  .divider{height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);margin:2px 0}
  #help{font-size:10.5px;line-height:1.95;color:#c2a071;letter-spacing:.06em;margin-top:auto}
  #help b{color:#e9d9b8;font-weight:700}
  #help .key{
    display:inline-block;border:1px solid #6e4a2a;border-radius:3px;
    padding:0 5px;margin-right:4px;font-size:10px;color:#ffd98a;background:rgba(0,0,0,.35);
  }
  #mutestate{color:#8a6a45}
</style>
</head>
<body>
<div id="stage">
  <div id="frame"><canvas id="game" width="480" height="640"></canvas></div>
  <aside id="panel">
    <h1>紅夜抄<small>CRIMSON NIGHT FRAGMENT.</small></h1>
    <div class="row"><span class="lbl">SCORE</span><span class="val big" id="score">0</span></div>
    <div class="row"><span class="lbl">HI&nbsp;SCORE</span><span class="val" id="hiscore">0</span></div>
    <div class="divider"></div>
    <div class="row"><span class="lbl">PLAYER</span><span class="val" id="lives">★★</span></div>
    <div class="row"><span class="lbl">BOMB</span><span class="val" id="bombs">✦✦✦</span></div>
    <div class="divider"></div>
    <div class="row"><span class="lbl">POWER</span><span class="val" id="power">0 / 8</span></div>
    <div class="row"><span class="lbl">GRAZE</span><span class="val" id="graze">0</span></div>
    <div id="help">
      <span class="key">←↑↓→</span>移動　<span class="key">Shift</span>低速（喰らい判定表示）<br>
      <span class="key">Z</span>ショット　<span class="key">X</span>ボム　<span class="key">Esc</span>ポーズ<br>
      <span class="key">M</span>サウンド <span id="mutestate">ON</span>　<span class="key">R</span>リスタート<br>
      <b>かすり(GRAZE)</b>で得点。Pで火力強化。<br>
      画面上部で点アイテム自動回収。
    </div>
  </aside>
</div>

<script>
'use strict';
/* ============================================================
   紅夜抄 〜 Crimson Night Fragment.
   東方紅魔郷リスペクトのオリジナル縦スクロール弾幕STG
   - 多層パララックス背景＋落ち影＋スケールイン湧きで疑似立体感
   - スペルカード制ボス / グレイズ / パワーアイテム
   ============================================================ */
const W = 480, H = 640;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
// 高DPI対応（Safari / Edge 共通の標準手法）
(function(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
})();

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------------- サウンド（軽量シンセSFX） ---------------- */
const SFX = {
  ac: null, master: null, noiseBuf: null, on: true,
  init(){
    if (this.ac) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ac = new AC();
    this.master = this.ac.createGain();
    this.master.gain.value = 0.14;
    this.master.connect(this.ac.destination);
    const len = this.ac.sampleRate * 0.5;
    this.noiseBuf = this.ac.createBuffer(1, len, this.ac.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  },
  tone(freq, dur, type, vol, slide){
    if (!this.ac || !this.on) return;
    const t = this.ac.currentTime;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, hp){
    if (!this.ac || !this.on) return;
    const t = this.ac.currentTime;
    const s = this.ac.createBufferSource(); s.buffer = this.noiseBuf;
    const f = this.ac.createBiquadFilter();
    f.type = hp ? 'highpass' : 'lowpass'; f.frequency.value = hp ? 900 : 600;
    const g = this.ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t + dur + 0.02);
  },
  graze(){ this.tone(2400, 0.04, 'square', 0.5); },
  hit(){ this.tone(320, 0.05, 'sawtooth', 0.18, 160); },
  boom(){ this.noise(0.28, 0.6); this.tone(140, 0.25, 'triangle', 0.4, 50); },
  bigboom(){ this.noise(0.7, 0.9); this.tone(90, 0.6, 'triangle', 0.6, 30); },
  item(){ this.tone(1300, 0.06, 'square', 0.25, 1900); },
  pdeath(){ this.noise(0.5, 0.8, true); this.tone(600, 0.4, 'sawtooth', 0.4, 60); },
  bomb(){ this.noise(0.6, 0.7); this.tone(60, 0.7, 'sine', 0.7, 200); },
  spell(){ this.tone(520, 0.4, 'triangle', 0.4, 1040); this.tone(780, 0.5, 'triangle', 0.25, 1560); },
  extend(){ [880,1108,1318,1760].forEach((f,i)=>setTimeout(()=>this.tone(f,0.18,'square',0.3),i*90)); }
};

/* ---------------- 入力 ---------------- */
const keys = {};
addEventListener('keydown', e => {
  SFX.init();
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  keys[k] = true;
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
  if (k === 'Escape' && (game.state === 'play' || game.state === 'pause'))
    game.state = game.state === 'play' ? 'pause' : 'play';
  if (k === 'm'){
    SFX.on = !SFX.on;
    document.getElementById('mutestate').textContent = SFX.on ? 'ON' : 'OFF';
  }
  if (k === 'r' && game.state !== 'title') resetGame(true);
  if ((k === 'z' || e.key === ' ' || k === 'Enter') &&
      (game.state === 'title' || game.state === 'over' || game.state === 'clear')){
    resetGame(true);
  }
});
addEventListener('keyup', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  keys[k] = false;
});
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

/* ---------------- 背景：夜の森タイル（事前生成） ---------------- */
function makeBGTile(){
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#0d0a1d'; g.fillRect(0, 0, W, H);
  // 森のしみ（縦ループするように±Hにも複写）
  for (let i = 0; i < 170; i++){
    const x = Math.random() * W, y = Math.random() * H;
    const r = rand(14, 52);
    const shade = ['#0a1424','#0c1a2c','#091020','#101b2a','#0b1526'][i % 5];
    g.fillStyle = shade;
    for (const oy of [-H, 0, H]){
      g.beginPath();
      g.ellipse(x, y + oy, r, r * rand(.6,.9), Math.random()*TAU, 0, TAU);
      g.fill();
    }
  }
  // 蛇行する川（周期H：上下が滑らかに繋がる）
  const riverX = y => W*0.5 + 95*Math.sin(TAU*y/H) + 42*Math.sin(2*TAU*y/H + 1.3);
  for (let pass = 0; pass < 2; pass++){
    g.lineWidth = pass === 0 ? 44 : 22;
    g.strokeStyle = pass === 0 ? 'rgba(34,52,96,0.85)' : 'rgba(78,110,180,0.55)';
    g.lineCap = 'round';
    g.beginPath();
    for (let y = -10; y <= H + 10; y += 8){
      const x = riverX(y);
      y <= -10 + 8 ? g.moveTo(x, y) : g.lineTo(x, y);
    }
    g.stroke();
  }
  // 月光の反射きらめき
  g.fillStyle = 'rgba(200,220,255,0.5)';
  for (let i = 0; i < 60; i++){
    const y = Math.random() * H;
    const x = riverX(y) + rand(-16, 16);
    for (const oy of [-H, 0, H]) g.fillRect(x, y + oy, rand(1.5,4), 1.4);
  }
  // 木々のハイライト（月光側）
  g.fillStyle = 'rgba(120,90,140,0.10)';
  for (let i = 0; i < 90; i++){
    const x = Math.random()*W, y = Math.random()*H, r = rand(5,16);
    for (const oy of [-H, 0, H]){
      g.beginPath(); g.ellipse(x, y+oy, r, r*.5, 0, 0, TAU); g.fill();
    }
  }
  return c;
}
const bgTile = makeBGTile();

// 雲（中層パララックス：影を地面に落として高度感を出す）
const clouds = [];
for (let i = 0; i < 7; i++){
  clouds.push({ x: rand(-40, W+40), y: rand(0, H), w: rand(90, 200), h: rand(34, 70), sp: rand(2.0, 3.0), a: rand(.10,.2) });
}
// 最前面の霧（最速で流れる＝カメラに最も近い）
const mists = [];
for (let i = 0; i < 5; i++){
  mists.push({ x: rand(0, W), y: rand(0, H), w: rand(180, 340), sp: rand(4.2, 5.6), a: rand(.05,.09) });
}
// 蛍（地表のきらめき）
const fireflies = [];
for (let i = 0; i < 26; i++){
  fireflies.push({ x: rand(0, W), y: rand(0, H), p: rand(0, TAU) });
}

/* ---------------- 弾スプライト事前描画 ---------------- */
const BULLET_COLORS = {
  red:    ['#fff', '#ff5d6e', 'rgba(255,60,90,0)'],
  pink:   ['#fff', '#ff8fd0', 'rgba(255,120,200,0)'],
  purple: ['#fff', '#c07cff', 'rgba(170,100,255,0)'],
  blue:   ['#fff', '#6e9bff', 'rgba(90,140,255,0)'],
  cyan:   ['#fff', '#67e6ff', 'rgba(90,220,255,0)'],
  yellow: ['#fff', '#ffd967', 'rgba(255,210,90,0)'],
  white:  ['#fff', '#e8ecff', 'rgba(220,225,255,0)'],
  green:  ['#fff', '#7dffa9', 'rgba(110,255,160,0)'],
};
const bulletSprites = {};
for (const key in BULLET_COLORS){
  const c = document.createElement('canvas');
  const R = 24; c.width = c.height = R*2;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(R, R, 1, R, R, R);
  gr.addColorStop(0, BULLET_COLORS[key][0]);
  gr.addColorStop(0.42, BULLET_COLORS[key][1]);
  gr.addColorStop(1, BULLET_COLORS[key][2]);
  g.fillStyle = gr;
  g.beginPath(); g.arc(R, R, R, 0, TAU); g.fill();
  bulletSprites[key] = c;
}

/* ---------------- ゲーム状態 ---------------- */
const game = {
  state: 'title', frame: 0, stageT: 0,
  score: 0, hiscore: 0, graze: 0,
  shake: 0, flash: 0, slowmoT: 0,
  nextExtend: 0,
};
const EXTENDS = [1500000, 4000000, 8000000];

const player = {
  x: W/2, y: H - 80, r: 2.6, grazeR: 15,
  lives: 2, bombs: 3, power: 0,
  inv: 0, respawn: 0, shotCD: 0, bombCD: 0,
  bank: 0, optAng: 0, dead: false,
};

let pBullets = [], eBullets = [], enemies = [], items = [], particles = [], popups = [];
let boss = null;
let events = [];
let bombWave = null;

/* ---------------- 汎用：弾発射 ---------------- */
function shoot(x, y, spd, ang, color, r, fn){
  if (eBullets.length > 950) return null;
  const b = { x, y, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd,
              r: r || 5, c: color, t: 0, grazed: false, dead: false,
              shape: 'orb', ang, spd, fn: fn || null };
  eBullets.push(b);
  return b;
}
function knife(x, y, spd, ang, color, fn){
  const b = shoot(x, y, spd, ang, color, 4.5, fn);
  if (b) b.shape = 'knife';
  return b;
}
function ring(x, y, n, spd, color, r, off, fn){
  for (let i = 0; i < n; i++) shoot(x, y, spd, (off||0) + TAU*i/n, color, r, fn);
}
function aimAng(x, y){ return Math.atan2(player.y - y, player.x - x); }
function fanAimed(x, y, n, spread, spd, color, r){
  const base = aimAng(x, y);
  for (let i = 0; i < n; i++)
    shoot(x, y, spd, base + spread*(i-(n-1)/2), color, r);
}

/* ---------------- パーティクル ---------------- */
function burst(x, y, n, color, spd, life){
  for (let i = 0; i < n; i++){
    const a = rand(0, TAU), s = rand(spd*0.3, spd);
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      life: rand(life*0.5, life), maxLife: life, c: color, r: rand(1.5, 3.5) });
  }
}
function ringFX(x, y, color, maxR){
  particles.push({ x, y, vx:0, vy:0, life: 22, maxLife: 22, c: color, ringR: 4, ringMax: maxR || 60 });
}
function popup(x, y, text, color){
  popups.push({ x, y, text, c: color || '#ffd98a', life: 50 });
}

/* ---------------- アイテム ---------------- */
function dropItem(x, y, type){
  items.push({ x, y, vy: -2.6, type, t: 0, mag: false });
}
function dropSpread(x, y, nP, nPt){
  for (let i = 0; i < nP; i++) dropItem(x + rand(-26,26), y + rand(-16,16), 'P');
  for (let i = 0; i < nPt; i++) dropItem(x + rand(-26,26), y + rand(-16,16), 'point');
}

/* ---------------- 敵 ---------------- */
function spawnEnemy(def){
  enemies.push(Object.assign({
    x: 0, y: -20, hp: 6, r: 12, t: 0, scale: 0, dead: false,
    color: '#ff7da0', wing: '#cfe6ff', drops: { p: 0, pt: 1 }, score: 1200,
  }, def));
}
// 小妖精：サインカーブで横切りつつ自機狙い3way
function fairySweep(side, yBase, color){
  spawnEnemy({
    x: side < 0 ? -20 : W+20, y: yBase, hp: 7, color,
    update(e){
      e.x += side < 0 ? 2.4 : -2.4;
      e.y = yBase + Math.sin(e.t * 0.045) * 46;
      if (e.t % 64 === 40 && e.y < player.y - 60) fanAimed(e.x, e.y, 3, 0.24, 2.6, 'red', 5);
      if (e.x < -40 || e.x > W+40) e.dead = true;
    }
  });
}
// リング妖精：降下→全方位→離脱
function fairyRing(x, color, n){
  spawnEnemy({
    x, y: -20, hp: 16, r: 14, color, score: 2600, drops: { p: 1, pt: 2 },
    update(e){
      if (e.t < 70) e.y += 2.3;
      else if (e.t === 86 || e.t === 122){ ring(e.x, e.y, n || 22, 1.9, 'blue', 5, rand(0,TAU)); SFX.tone(220,.08,'square',.1); }
      else if (e.t > 150) { e.y -= 2.6; e.x += (x < W/2 ? -1.4 : 1.4); }
      if (e.y < -40) e.dead = true;
    }
  });
}
// 突撃妖精：斜めに高速突入、単発自機狙い
function fairyRush(x, dir){
  spawnEnemy({
    x, y: -16, hp: 4, r: 10, color: '#9ad0ff', score: 900, drops:{p:0,pt:1},
    update(e){
      e.y += 4.4; e.x += dir * 1.3;
      if (e.t === 30) shoot(e.x, e.y, 3.4, aimAng(e.x, e.y), 'cyan', 5);
      if (e.y > H + 30) e.dead = true;
    }
  });
}
// 大妖精：その場で扇連射
function fairyBig(x, targetY){
  spawnEnemy({
    x, y: -30, hp: 70, r: 20, color: '#ff5d6e', wing: '#ffd0da',
    score: 9000, drops: { p: 2, pt: 4 },
    update(e){
      if (e.y < targetY) e.y += 1.9;
      else {
        const c = e.t % 130;
        if (c >= 30 && c < 70 && c % 8 === 0)
          fanAimed(e.x, e.y + 8, 5, 0.21, 2.2 + (c-30)/55, 'pink', 6);
        if (c === 100) ring(e.x, e.y, 26, 1.6, 'purple', 5, rand(0, TAU));
      }
      if (e.t > 540){ e.y -= 2.2; if (e.y < -50) e.dead = true; }
    }
  });
}

/* ---------------- ステージ進行（秒指定イベント） ---------------- */
function buildStage(){
  events = [];
  const at = (sec, fn) => events.push({ t: Math.floor(sec * 60), fn, done: false });
  for (let i = 0; i < 6; i++) at(1.5 + i*0.5, () => fairySweep(-1, 70 + i*8, '#ff9db5'));
  for (let i = 0; i < 6; i++) at(6.5 + i*0.5, () => fairySweep(1, 90 + i*8, '#9ad0ff'));
  at(12, () => { fairyRing(W*0.3, '#86c5ff'); fairyRing(W*0.7, '#86c5ff'); });
  at(16, () => fairyRing(W*0.5, '#c490ff', 30));
  for (let i = 0; i < 10; i++) at(20 + i*0.45, () => fairyRush(rand(40, W-40), Math.random()<.5?-1:1));
  at(26, () => { fairyBig(W*0.3, 130); });
  at(28, () => { fairyBig(W*0.7, 110); });
  for (let i = 0; i < 8; i++){
    at(36 + i*0.4, () => { fairySweep(-1, 60 + i*10, '#ffd0a0'); fairySweep(1, 70 + i*10, '#ffd0a0'); });
  }
  at(43, () => { fairyRing(W*0.25,'#86c5ff'); fairyRing(W*0.5,'#c490ff',28); fairyRing(W*0.75,'#86c5ff'); });
  for (let i = 0; i < 12; i++) at(48 + i*0.3, () => fairyRush(rand(30, W-30), Math.random()<.5?-1:1));
  at(56, () => { popup(W/2, 240, '— WARNING —', '#ff5d6e'); SFX.spell(); });
  at(58.5, spawnBoss);
}

/* ---------------- ボス ---------------- */
const bossPhases = [
  { name: null, hp: 850, time: 28,
    atk(b, t){
      if (t % 90 < 28 && t % 9 === 0) fanAimed(b.x, b.y + 12, 5, 0.2, 3.0, 'red', 6);
      if (t % 140 === 70) ring(b.x, b.y, 24, 1.8, 'pink', 5, rand(0, TAU));
      if (t % 170 === 0) b.tx = rand(110, W-110);
    } },
  { name: '紅符「スカーレットレイン」', hp: 1050, time: 40,
    atk(b, t){
      b.a1 = (b.a1 || 0) + 0.072;
      if (t % 3 === 0){
        shoot(b.x, b.y, 2.05, b.a1, 'red', 6);
        shoot(b.x, b.y, 2.05, b.a1 + Math.PI, 'red', 6);
        shoot(b.x, b.y, 1.55, -b.a1*1.18, 'purple', 5);
        shoot(b.x, b.y, 1.55, -b.a1*1.18 + Math.PI, 'purple', 5);
      }
      if (t % 14 === 0) shoot(rand(10, W-10), -8, rand(2.0, 3.2), Math.PI/2 + rand(-.12,.12), 'pink', 5);
      if (t % 240 === 0) b.tx = rand(150, W-150);
    } },
  { name: '夜符「ミッドナイトナイフ」', hp: 1050, time: 44,
    atk(b, t){
      if (t % 110 === 0){
        b.tx = rand(90, W-90);
        const n = 26, off = rand(0, TAU);
        for (let i = 0; i < n; i++){
          knife(b.x, b.y, 4.2, off + TAU*i/n, 'cyan', (k) => {
            if (k.t < 42){ k.vx *= 0.93; k.vy *= 0.93; }
            else if (k.t === 60){
              const a = aimAng(k.x, k.y) + rand(-.07,.07);
              k.vx = Math.cos(a)*4.6; k.vy = Math.sin(a)*4.6; k.ang = a;
              if (k.t === 60 && Math.random() < .08) SFX.tone(1500,.05,'square',.12);
            }
          });
        }
      }
      if (t % 110 === 55) fanAimed(b.x, b.y, 3, 0.3, 3.2, 'white', 5);
    } },
  { name: '紅月「エターナル・スカーレット」', hp: 1350, time: 55,
    atk(b, t){
      b.tx = W/2 + Math.sin(t * 0.008) * 70;
      b.a2 = (b.a2 || 0) + 0.034;
      if (t % 5 === 0){
        for (let k = 0; k < 5; k++){
          const a = b.a2 + TAU*k/5;
          shoot(b.x, b.y, 1.7 + 0.5*Math.sin(t*0.05), a, k%2 ? 'red' : 'purple', 6);
        }
      }
      if (t % 130 === 65) fanAimed(b.x, b.y, 7, 0.16, 4.0, 'yellow', 5);
      if (t % 260 === 0) ring(b.x, b.y, 36, 2.5, 'white', 5, rand(0,TAU));
    } },
];

function spawnBoss(){
  boss = {
    x: W/2, y: -60, tx: W/2, ty: 110,
    r: 26, phase: -1, hp: 0, maxHp: 1, t: 0, phaseT: 0, timer: 0,
    entering: true, transition: 0, fail: false, cutin: 0, dead: false, a1: 0, a2: 0,
  };
  nextPhase();
}
function nextPhase(){
  boss.phase++;
  if (boss.phase >= bossPhases.length){ killBoss(); return; }
  const p = bossPhases[boss.phase];
  boss.hp = boss.maxHp = p.hp;
  boss.timer = p.time * 60;
  boss.phaseT = 0; boss.fail = false;
  boss.transition = 70;
  eBullets.forEach(b => { b.dead = true; spawnConvert(b); });
  if (p.name){ boss.cutin = 130; SFX.spell(); }
}
function spawnConvert(b){ // 弾消し→星アイテム風エフェクト
  particles.push({ x: b.x, y: b.y, vx: rand(-.6,.6), vy: rand(-1.6,-.4),
    life: 28, maxLife: 28, c: '#ffd98a', r: 2 });
}
function endPhase(byKill){
  const p = bossPhases[boss.phase];
  if (p.name && byKill && !boss.fail){
    game.score += 120000; popup(boss.x, boss.y - 40, 'Spell Card Bonus! +120000', '#7dffa9');
    SFX.extend();
  }
  dropSpread(boss.x, boss.y, 2, 6);
  burst(boss.x, boss.y, 40, '#ff8fa0', 5, 40);
  ringFX(boss.x, boss.y, 'rgba(255,120,140,0.8)', 130);
  SFX.boom(); game.shake = 10;
  nextPhase();
}
function killBoss(){
  boss.dead = true;
  eBullets.forEach(b => { b.dead = true; spawnConvert(b); });
  dropSpread(boss.x, boss.y, 4, 14);
  for (let i = 0; i < 3; i++)
    setTimeout(() => { if(boss){ burst(boss.x+rand(-30,30), boss.y+rand(-30,30), 50, '#ffb0c0', 6, 50); } }, i*160);
  ringFX(boss.x, boss.y, 'rgba(255,200,210,0.9)', 240);
  SFX.bigboom(); game.shake = 22; game.flash = 24; game.slowmoT = 50;
  game.score += 500000;
  popup(boss.x, boss.y, 'STAGE CLEAR +500000', '#ffd98a');
  setTimeout(() => { if (game.state === 'play') game.state = 'clear'; }, 2400);
}

/* ---------------- 自機 ---------------- */
function playerUpdate(){
  if (player.respawn > 0){
    player.respawn--;
    if (player.respawn === 0){
      player.x = W/2; player.y = H - 70; player.inv = 180; player.dead = false;
    }
    return;
  }
  const focus = keys['Shift'];
  const sp = focus ? 2.0 : 4.3;
  let dx = 0, dy = 0;
  if (keys['ArrowLeft'] || keys['a']) dx--;
  if (keys['ArrowRight'] || keys['d']) dx++;
  if (keys['ArrowUp'] || keys['w']) dy--;
  if (keys['ArrowDown'] || keys['s']) dy++;
  if (dx && dy){ dx *= 0.7071; dy *= 0.7071; }
  player.x = clamp(player.x + dx*sp, 14, W-14);
  player.y = clamp(player.y + dy*sp, 20, H-16);
  player.bank = lerp(player.bank, dx * (focus ? 0.12 : 0.3), 0.2);
  player.optAng += focus ? 0.05 : 0.11;
  if (player.inv > 0) player.inv--;
  if (player.shotCD > 0) player.shotCD--;
  if (player.bombCD > 0) player.bombCD--;

  // ショット
  if ((keys['z'] || keys[' ']) && player.shotCD <= 0){
    player.shotCD = 5;
    pBullets.push({ x: player.x-7, y: player.y-12, vx: 0, vy: -11.5, dmg: 2, w: 4 });
    pBullets.push({ x: player.x+7, y: player.y-12, vx: 0, vy: -11.5, dmg: 2, w: 4 });
    const opts = optionPositions(focus);
    for (let i = 0; i < opts.length; i++){
      const spread = focus ? 0 : (i % 2 === 0 ? -0.16 : 0.16);
      pBullets.push({ x: opts[i].x, y: opts[i].y, vx: Math.sin(spread)*-10, vy: -10*Math.cos(spread), dmg: 1.3, w: 3 });
    }
  }
  // ボム
  if (keys['x'] && player.bombs > 0 && player.bombCD <= 0 && !bombWave){
    player.bombs--; player.bombCD = 120; player.inv = Math.max(player.inv, 150);
    if (boss && !boss.entering) boss.fail = true;
    bombWave = { r: 10, x: player.x, y: player.y };
    SFX.bomb(); game.shake = 12; game.flash = 10;
  }
  // アイテム吸引ライン
  if (player.y < 165) items.forEach(it => it.mag = true);
}
function optionPositions(focus){
  const n = Math.min(4, Math.floor(player.power / 2));
  const arr = [];
  for (let i = 0; i < n; i++){
    const side = i % 2 === 0 ? -1 : 1;
    const tier = Math.floor(i / 2);
    const ox = side * (focus ? 13 + tier*11 : 22 + tier*16);
    const oy = (focus ? -2 : 6) + tier*10 + Math.sin(player.optAng + i)*2.5;
    arr.push({ x: player.x + ox, y: player.y + oy });
  }
  return arr;
}
function killPlayer(){
  if (player.inv > 0 || player.respawn > 0) return;
  SFX.pdeath();
  burst(player.x, player.y, 40, '#ff9db5', 5, 45);
  ringFX(player.x, player.y, 'rgba(255,120,150,0.9)', 110);
  game.shake = 14; game.flash = 12;
  if (boss && !boss.entering) boss.fail = true;
  player.power = Math.max(0, player.power - 3);
  // 救済：パワーをばら撒く
  for (let i = 0; i < 3; i++) dropItem(player.x + rand(-30,30), player.y - 20, 'P');
  eBullets.forEach(b => { if (Math.hypot(b.x-player.x, b.y-player.y) < 130){ b.dead = true; spawnConvert(b);} });
  if (player.lives <= 0){
    player.dead = true;
    setTimeout(() => { if (game.state === 'play') game.state = 'over'; }, 1200);
    player.respawn = 99999;
  } else {
    player.lives--;
    player.bombs = Math.max(player.bombs, 3);
    player.respawn = 60; player.dead = true;
  }
}

/* ---------------- 更新 ---------------- */
function addScore(v){
  game.score += v;
  if (game.nextExtend < EXTENDS.length && game.score >= EXTENDS[game.nextExtend]){
    game.nextExtend++;
    player.lives++;
    popup(player.x, player.y - 30, 'EXTEND!', '#7dffa9');
    SFX.extend();
  }
}

function update(){
  game.stageT++;
  if (game.shake > 0) game.shake *= 0.88;
  if (game.flash > 0) game.flash--;
  if (game.slowmoT > 0) game.slowmoT--;

  playerUpdate();

  // ステージイベント
  for (const ev of events){
    if (!ev.done && game.stageT >= ev.t){ ev.done = true; ev.fn(); }
  }

  // 敵
  for (const e of enemies){
    e.t++;
    e.scale = Math.min(1, e.scale + 0.07); // 湧き出しスケールイン＝奥から接近する立体感
    e.update(e);
    if (!e.dead && e.hp <= 0){
      e.dead = true;
      addScore(e.score);
      popup(e.x, e.y, '+' + e.score, '#f2e3c2');
      burst(e.x, e.y, 14, e.color, 3.4, 30);
      ringFX(e.x, e.y, 'rgba(255,180,190,0.7)', 36);
      SFX.boom();
      dropSpread(e.x, e.y, Math.random() < 0.45 ? e.drops.p || (Math.random()<.3?1:0) : e.drops.p, e.drops.pt);
    }
  }
  enemies = enemies.filter(e => !e.dead);

  // ボス
  if (boss && !boss.dead){
    boss.t++;
    if (boss.entering){
      boss.y = lerp(boss.y, boss.ty, 0.04);
      if (Math.abs(boss.y - boss.ty) < 2) boss.entering = false;
    } else if (boss.transition > 0){
      boss.transition--;
    } else {
      boss.phaseT++;
      boss.timer--;
      boss.x = lerp(boss.x, boss.tx, 0.03);
      boss.y = lerp(boss.y, boss.ty + Math.sin(boss.t * 0.02) * 10, 0.05);
      bossPhases[boss.phase].atk(boss, boss.phaseT);
      if (boss.timer <= 0) endPhase(false);
    }
    if (boss.cutin > 0) boss.cutin--;
  }

  // 自弾
  for (const b of pBullets){
    b.x += b.vx; b.y += b.vy;
    if (b.y < -20) { b.dead = true; continue; }
    if (boss && !boss.dead && !boss.entering && boss.transition <= 0 &&
        Math.hypot(b.x - boss.x, b.y - boss.y) < boss.r + 6){
      b.dead = true; boss.hp -= b.dmg;
      particles.push({ x:b.x, y:b.y-4, vx:rand(-1,1), vy:-2, life:10, maxLife:10, c:'#fff', r:2 });
      if (game.frame % 4 === 0) SFX.hit();
      addScore(10);
      if (boss.hp <= 0) endPhase(true);
    } else {
      for (const e of enemies){
        if (!e.dead && Math.hypot(b.x-e.x, b.y-e.y) < e.r + 5){
          b.dead = true; e.hp -= b.dmg;
          if (game.frame % 5 === 0) SFX.hit();
          addScore(10);
          break;
        }
      }
    }
  }
  pBullets = pBullets.filter(b => !b.dead);

  // 敵弾
  const px = player.x, py = player.y;
  for (const b of eBullets){
    b.t++;
    if (b.fn) b.fn(b);
    b.x += b.vx; b.y += b.vy;
    if (b.shape === 'knife') b.ang = Math.atan2(b.vy, b.vx);
    if (b.x < -30 || b.x > W+30 || b.y < -40 || b.y > H+30){ b.dead = true; continue; }
    if (player.respawn <= 0 && !player.dead){
      const d = Math.hypot(b.x - px, b.y - py);
      if (d < b.r * 0.62 + player.r){
        if (player.inv <= 0){ b.dead = true; killPlayer(); }
      } else if (!b.grazed && d < b.r + player.grazeR){
        b.grazed = true; game.graze++;
        addScore(500);
        SFX.graze();
        particles.push({ x: px + rand(-8,8), y: py + rand(-8,8), vx: rand(-2,2), vy: rand(-2,2),
          life: 12, maxLife: 12, c: '#fff', r: 1.5 });
      }
    }
    if (bombWave && Math.hypot(b.x - bombWave.x, b.y - bombWave.y) < bombWave.r){
      b.dead = true; spawnConvert(b); addScore(300);
    }
  }
  eBullets = eBullets.filter(b => !b.dead);

  // ボム波
  if (bombWave){
    bombWave.r += 14;
    if (boss && !boss.dead && !boss.entering && boss.transition <= 0 &&
        Math.hypot(boss.x-bombWave.x, boss.y-bombWave.y) < bombWave.r){
      boss.hp -= 3;
      if (boss.hp <= 0) endPhase(true);
    }
    for (const e of enemies) if (Math.hypot(e.x-bombWave.x, e.y-bombWave.y) < bombWave.r) e.hp -= 2.5;
    if (bombWave.r > 800) bombWave = null;
  }

  // アイテム
  for (const it of items){
    it.t++;
    if (it.mag || Math.hypot(it.x-px, it.y-py) < 48){
      const a = Math.atan2(py - it.y, px - it.x);
      it.x += Math.cos(a) * 8; it.y += Math.sin(a) * 8;
    } else {
      it.vy = Math.min(2.4, it.vy + 0.07);
      it.y += it.vy;
      it.x += Math.sin(it.t * 0.05) * 0.3;
    }
    if (it.y > H + 20){ it.dead = true; continue; }
    if (!player.dead && Math.hypot(it.x-px, it.y-py) < 24){
      it.dead = true;
      SFX.item();
      if (it.type === 'P'){
        if (player.power < 8){ player.power++; popup(px, py-24, 'POWER UP', '#ff9db5'); }
        else addScore(8000);
      } else {
        const v = player.y < 165 ? 22000 : 10000;
        addScore(v); popup(it.x, it.y, '+' + v, '#8fb8ff');
      }
    }
  }
  items = items.filter(i => !i.dead);

  // パーティクル
  for (const p of particles){
    p.life--;
    if (p.ringR !== undefined){ p.ringR += (p.ringMax - p.ringR) * 0.18; }
    else { p.x += p.vx; p.y += p.vy; p.vx *= 0.97; p.vy *= 0.97; }
  }
  particles = particles.filter(p => p.life > 0);
  for (const p of popups){ p.life--; p.y -= 0.6; }
  popups = popups.filter(p => p.life > 0);
}

/* ============================================================
   描画
   ============================================================ */
let bgScroll = 0;
function drawBG(){
  bgScroll += 1.35; // 地面（最遠層）：ゆっくり
  const off = bgScroll % H;
  ctx.drawImage(bgTile, 0, off - H, W, H);
  ctx.drawImage(bgTile, 0, off, W, H);

  // 蛍
  for (const f of fireflies){
    f.p += 0.04;
    const fy = (f.y + bgScroll) % H;
    const a = 0.25 + 0.25 * Math.sin(f.p);
    ctx.fillStyle = `rgba(180,255,160,${a})`;
    ctx.fillRect(f.x, fy, 1.6, 1.6);
  }

  // 雲の影（地面に落ちる）→ 雲本体（中層・速い）= 高度差の表現
  for (const c of clouds){
    c.y += c.sp;
    if (c.y > H + 80){ c.y = -80; c.x = rand(-40, W+40); }
    ctx.fillStyle = `rgba(0,0,0,${c.a * 1.2})`;
    ctx.beginPath(); ctx.ellipse(c.x + 26, c.y + 34, c.w*0.5, c.h*0.5, 0, 0, TAU); ctx.fill();
  }
  for (const c of clouds){
    const g = ctx.createRadialGradient(c.x, c.y, 4, c.x, c.y, c.w*0.6);
    g.addColorStop(0, `rgba(190,170,220,${c.a*1.6})`);
    g.addColorStop(1, 'rgba(190,170,220,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(c.x, c.y, c.w*0.6, c.h*0.6, 0, 0, TAU); ctx.fill();
  }

  // スペル中の暗転＋回転魔法陣
  if (boss && !boss.dead && bossPhases[boss.phase] && bossPhases[boss.phase].name && boss.transition <= 0){
    ctx.fillStyle = 'rgba(20,2,10,0.42)';
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(boss.x, boss.y);
    ctx.rotate(game.frame * 0.004);
    ctx.globalAlpha = 0.16;
    ctx.strokeStyle = '#ff6e86';
    for (let i = 0; i < 3; i++){
      const r = 120 + i * 95;
      ctx.lineWidth = i === 0 ? 2 : 1;
      ctx.setLineDash([12 + i*8, 9]);
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // 最前面の霧（最速＝カメラ直近）
  for (const m of mists){
    m.y += m.sp;
    if (m.y > H + 50){ m.y = -60; m.x = rand(0, W); }
    const g = ctx.createRadialGradient(m.x, m.y, 4, m.x, m.y, m.w*0.5);
    g.addColorStop(0, `rgba(255,120,140,${m.a})`);
    g.addColorStop(1, 'rgba(255,120,140,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(m.x, m.y, m.w*0.5, m.w*0.16, 0, 0, TAU); ctx.fill();
  }
}

function drawShadow(x, y, w, h, alpha){
  ctx.fillStyle = `rgba(0,0,0,${alpha === undefined ? 0.3 : alpha})`;
  ctx.beginPath(); ctx.ellipse(x + 8, y + 20, w, h, 0, 0, TAU); ctx.fill();
}

function drawPlayer(){
  if (player.respawn > 0 && player.respawn < 99999) return;
  if (player.dead && player.respawn >= 99999) return;
  const blink = player.inv > 0 && Math.floor(player.inv / 4) % 2 === 0;
  const focus = keys['Shift'];
  const ops = optionPositions(focus);

  drawShadow(player.x, player.y, 14, 5, 0.35);
  for (const o of ops) drawShadow(o.x, o.y, 5, 2.4, 0.3);

  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.bank);
  ctx.globalAlpha = blink ? 0.35 : 1;
  // 機体：紅白の小型機（巫女装束イメージ）
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(0, -15); ctx.lineTo(8, 4); ctx.lineTo(0, 10); ctx.lineTo(-8, 4);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#d8233c';
  ctx.beginPath();
  ctx.moveTo(0, -4); ctx.lineTo(13, 9); ctx.lineTo(7, 12); ctx.lineTo(0, 5);
  ctx.lineTo(-7, 12); ctx.lineTo(-13, 9); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffd0d8';
  ctx.beginPath(); ctx.arc(0, -7, 3, 0, TAU); ctx.fill();
  // エンジン光
  const fl = 4 + Math.sin(game.frame * 0.6) * 1.6;
  const g = ctx.createRadialGradient(0, 13, 1, 0, 13, fl + 6);
  g.addColorStop(0, 'rgba(255,230,180,0.9)');
  g.addColorStop(1, 'rgba(255,120,80,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 13, fl + 6, 0, TAU); ctx.fill();
  ctx.restore();

  // オプション
  for (let i = 0; i < ops.length; i++){
    ctx.save();
    ctx.translate(ops[i].x, ops[i].y);
    ctx.rotate(player.optAng * 2 + i);
    ctx.globalAlpha = blink ? 0.35 : 0.95;
    ctx.fillStyle = '#ffb3c0';
    ctx.fillRect(-4, -4, 8, 8);
    ctx.fillStyle = '#fff';
    ctx.fillRect(-1.6, -1.6, 3.2, 3.2);
    ctx.restore();
  }

  // 低速時：喰らい判定＋グレイズ圏
  if (focus && !player.dead){
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, player.grazeR, 0, TAU); ctx.stroke();
    ctx.rotate(game.frame * 0.06);
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#ff3050'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.rect(-4, -4, 8, 8); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 2.4, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

function drawEnemy(e){
  const s = e.scale;
  drawShadow(e.x, e.y, e.r * s, e.r * 0.4 * s, 0.32 * s);
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.scale(s, s);
  // 羽（はばたき）
  const flap = Math.sin(e.t * 0.3) * 0.5 + 0.8;
  ctx.fillStyle = e.wing || '#cfe6ff';
  ctx.globalAlpha = 0.85;
  for (const side of [-1, 1]){
    ctx.beginPath();
    ctx.ellipse(side * e.r * 0.85, -2, e.r * 0.8 * flap, e.r * 0.45, side * 0.5, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(side * e.r * 0.7, 5, e.r * 0.55 * flap, e.r * 0.3, side * 0.9, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // 胴体（球面ハイライトで立体に）
  const g = ctx.createRadialGradient(-e.r*0.3, -e.r*0.35, 1, 0, 0, e.r);
  g.addColorStop(0, '#fff');
  g.addColorStop(0.35, e.color);
  g.addColorStop(1, shade(e.color));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, e.r * 0.78, 0, TAU); ctx.fill();
  ctx.restore();
}
function shade(hex){
  const n = parseInt(hex.slice(1), 16);
  const r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  return `rgb(${r*0.45|0},${g*0.45|0},${b*0.5|0})`;
}

function drawBoss(){
  if (!boss || boss.dead) return;
  const bx = boss.x, by = boss.y;
  const bob = Math.sin(boss.t * 0.05) * 3;
  drawShadow(bx, by + 8, 30, 9, 0.4);

  // 足元の魔法陣（パース付き楕円＝床面の存在を示し立体感）
  ctx.save();
  ctx.translate(bx, by + 26);
  ctx.scale(1, 0.32);
  ctx.rotate(boss.t * 0.03);
  ctx.strokeStyle = 'rgba(255,110,134,0.55)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, 52, 0, TAU); ctx.stroke();
  ctx.setLineDash([8, 6]);
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(0, 0, 40, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  for (let i = 0; i < 6; i++){
    const a = TAU * i / 6 + boss.t * 0.03;
    ctx.fillStyle = 'rgba(255,160,180,0.8)';
    ctx.beginPath(); ctx.arc(Math.cos(a)*52, Math.sin(a)*52, 3, 0, TAU); ctx.fill();
  }
  ctx.restore();

  ctx.save();
  ctx.translate(bx, by + bob);
  // 蝙蝠羽
  const flap = Math.sin(boss.t * 0.08) * 0.25;
  ctx.fillStyle = 'rgba(70,16,40,0.95)';
  ctx.strokeStyle = '#ff5d7a';
  ctx.lineWidth = 1.2;
  for (const side of [-1, 1]){
    ctx.save();
    ctx.scale(side, 1);
    ctx.rotate(flap);
    ctx.beginPath();
    ctx.moveTo(8, -8);
    ctx.quadraticCurveTo(46, -34, 56, -6);
    ctx.quadraticCurveTo(44, -10, 40, 6);
    ctx.quadraticCurveTo(32, -2, 26, 12);
    ctx.quadraticCurveTo(18, 4, 8, 8);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  // ドレス
  const dg = ctx.createLinearGradient(0, -16, 0, 28);
  dg.addColorStop(0, '#ff8298');
  dg.addColorStop(0.5, '#c5283d');
  dg.addColorStop(1, '#5a0f22');
  ctx.fillStyle = dg;
  ctx.beginPath();
  ctx.moveTo(0, -14);
  ctx.quadraticCurveTo(20, 6, 16, 26);
  ctx.lineTo(-16, 26);
  ctx.quadraticCurveTo(-20, 6, 0, -14);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffe8ee';
  ctx.fillRect(-7, -6, 14, 4);
  // 頭部＋帽子
  const hg = ctx.createRadialGradient(-3, -25, 1, 0, -22, 10);
  hg.addColorStop(0, '#fff5ee'); hg.addColorStop(1, '#e8b9a8');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.arc(0, -22, 8, 0, TAU); ctx.fill();
  ctx.fillStyle = '#f7d9e3';
  ctx.beginPath();
  ctx.ellipse(0, -30, 13, 5, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#d8233c';
  ctx.fillRect(-13, -31, 26, 3);
  // 紅い瞳の光
  ctx.fillStyle = '#ff2040';
  ctx.fillRect(-4, -23, 2.4, 2.4); ctx.fillRect(2, -23, 2.4, 2.4);
  ctx.restore();

  // オーラ
  const ag = ctx.createRadialGradient(bx, by, 8, bx, by, 70);
  ag.addColorStop(0, 'rgba(255,80,110,0.12)');
  ag.addColorStop(1, 'rgba(255,80,110,0)');
  ctx.fillStyle = ag;
  ctx.beginPath(); ctx.arc(bx, by, 70, 0, TAU); ctx.fill();
}

function drawBullets(){
  // 敵弾（加算合成でグロー＝発光体の浮遊感）
  ctx.globalCompositeOperation = 'lighter';
  for (const b of eBullets){
    if (b.shape === 'knife'){
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.ang + Math.PI/2);
      const sp = bulletSprites[b.c];
      ctx.drawImage(sp, -5, -13, 10, 26);
      ctx.restore();
    } else {
      const d = b.r * 2.4;
      ctx.drawImage(bulletSprites[b.c], b.x - d/2, b.y - d/2, d, d);
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  // 自弾
  ctx.fillStyle = 'rgba(255,225,235,0.85)';
  for (const b of pBullets){
    ctx.beginPath();
    ctx.ellipse(b.x, b.y, b.w, 10, 0, 0, TAU);
    ctx.fill();
  }
}

function drawItems(){
  for (const it of items){
    drawShadow(it.x, it.y, 5, 2, 0.25);
    ctx.save();
    ctx.translate(it.x, it.y);
    if (it.type === 'P'){
      ctx.fillStyle = '#e23050';
      ctx.fillRect(-6, -7, 12, 14);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('P', 0, 1);
    } else {
      ctx.fillStyle = '#3a66d8';
      ctx.fillRect(-5.5, -6.5, 11, 13);
      ctx.fillStyle = '#cfe0ff';
      ctx.font = 'bold 9px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('点', 0, 1);
    }
    ctx.restore();
  }
}

function drawParticles(){
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles){
    const a = p.life / p.maxLife;
    if (p.ringR !== undefined){
      ctx.strokeStyle = p.c.replace(/[\d.]+\)$/, (a*0.9) + ')');
      ctx.lineWidth = 3 * a;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.ringR, 0, TAU); ctx.stroke();
    } else {
      ctx.globalAlpha = a;
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.5 + a*0.5), 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  if (bombWave){
    ctx.strokeStyle = 'rgba(160,255,200,0.7)';
    ctx.lineWidth = 8;
    ctx.beginPath(); ctx.arc(bombWave.x, bombWave.y, bombWave.r, 0, TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(bombWave.x, bombWave.y, bombWave.r*0.85, 0, TAU); ctx.stroke();
  }
}

function drawHUD(){
  // ポップアップ
  ctx.textAlign = 'center';
  ctx.font = '11px "Shippori Mincho", serif';
  for (const p of popups){
    ctx.globalAlpha = Math.min(1, p.life / 20);
    ctx.fillStyle = p.c;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;

  // ボスHPバー・スペル名・タイマー
  if (boss && !boss.dead){
    const p = bossPhases[boss.phase];
    const ratio = clamp(boss.hp / boss.maxHp, 0, 1);
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(16, 12, W-32, 5);
    const hg = ctx.createLinearGradient(16, 0, W-16, 0);
    hg.addColorStop(0, '#ff8298'); hg.addColorStop(1, '#c5283d');
    ctx.fillStyle = hg;
    ctx.fillRect(16, 12, (W-32) * ratio, 5);
    ctx.strokeStyle = 'rgba(255,210,170,0.5)';
    ctx.lineWidth = 1;
    ctx.strokeRect(16.5, 11.5, W-32, 6);
    // 残フェーズ星
    ctx.fillStyle = '#ffd98a';
    ctx.font = '11px serif';
    ctx.textAlign = 'left';
    let stars = '';
    for (let i = boss.phase + 1; i < bossPhases.length; i++) stars += '★';
    ctx.fillText(stars, 16, 30);
    if (p && p.name){
      ctx.textAlign = 'right';
      ctx.font = '13px "Shippori Mincho", serif';
      ctx.fillStyle = '#ffe2ea';
      ctx.shadowColor = '#c5283d'; ctx.shadowBlur = 8;
      ctx.fillText(p.name, W-16, 32);
      ctx.shadowBlur = 0;
    }
    ctx.textAlign = 'right';
    ctx.font = 'bold 15px "Shippori Mincho", serif';
    ctx.fillStyle = boss.timer < 600 ? '#ff7070' : '#f2e3c2';
    ctx.fillText(Math.max(0, Math.ceil(boss.timer/60)).toString().padStart(2,'0'), W-16, 52);
    // スペルカットイン
    if (boss.cutin > 0 && p && p.name){
      const k = boss.cutin;
      const slide = k > 110 ? (k-110)*14 : (k < 20 ? -(20-k)*14 : 0);
      ctx.save();
      ctx.globalAlpha = 0.92;
      ctx.translate(slide, 0);
      ctx.fillStyle = 'rgba(40,4,16,0.78)';
      ctx.fillRect(0, 160, W, 46);
      ctx.strokeStyle = '#d8a94e'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0,162); ctx.lineTo(W,162); ctx.moveTo(0,204); ctx.lineTo(W,204); ctx.stroke();
      ctx.fillStyle = '#ffd98a';
      ctx.font = '700 19px "Shippori Mincho", serif';
      ctx.textAlign = 'center';
      ctx.fillText(p.name, W/2, 189);
      ctx.restore();
    }
  }

  // フラッシュ
  if (game.flash > 0){
    ctx.fillStyle = `rgba(255,235,240,${game.flash/40})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function drawOverlay(){
  if (game.state === 'title'){
    ctx.fillStyle = 'rgba(8,2,8,0.66)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    // 月
    const mg = ctx.createRadialGradient(W/2, 180, 8, W/2, 180, 95);
    mg.addColorStop(0, 'rgba(255,120,130,0.5)');
    mg.addColorStop(0.45, 'rgba(200,50,80,0.22)');
    mg.addColorStop(1, 'rgba(200,50,80,0)');
    ctx.fillStyle = mg;
    ctx.beginPath(); ctx.arc(W/2, 180, 95, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffccd4';
    ctx.beginPath(); ctx.arc(W/2, 180, 52, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(180,60,80,0.25)';
    ctx.beginPath(); ctx.arc(W/2-14, 168, 11, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(W/2+18, 192, 8, 0, TAU); ctx.fill();
    ctx.fillStyle = '#2a0712';
    ctx.font = '800 46px "Zen Old Mincho","Shippori Mincho",serif';
    ctx.fillText('紅 夜 抄', W/2, 196);
    ctx.fillStyle = '#ffd98a';
    ctx.shadowColor = '#c5283d'; ctx.shadowBlur = 16;
    ctx.font = '800 44px "Zen Old Mincho","Shippori Mincho",serif';
    ctx.fillText('紅 夜 抄', W/2, 194);
    ctx.shadowBlur = 0;
    ctx.font = '13px "Shippori Mincho",serif';
    ctx.fillStyle = '#e9d9b8';
    ctx.fillText('〜 Crimson Night Fragment. 〜', W/2, 226);
    if (Math.floor(game.frame / 36) % 2 === 0){
      ctx.font = '700 17px "Shippori Mincho",serif';
      ctx.fillStyle = '#fff';
      ctx.fillText('Press Z to Start', W/2, 420);
    }
    ctx.font = '11.5px "Shippori Mincho",serif';
    ctx.fillStyle = '#c2a071';
    ctx.fillText('移動：矢印キー ／ ショット：Z ／ ボム：X ／ 低速：Shift', W/2, 470);
    ctx.fillText('弾を「かすって」スコアを稼げ。紅い夜の主を討て。', W/2, 492);
  }
  if (game.state === 'pause'){
    ctx.fillStyle = 'rgba(8,2,8,0.55)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd98a';
    ctx.font = '700 26px "Shippori Mincho",serif';
    ctx.fillText('一時停止', W/2, H/2 - 8);
    ctx.font = '12px "Shippori Mincho",serif';
    ctx.fillStyle = '#e9d9b8';
    ctx.fillText('Esc で再開 ／ R でリスタート', W/2, H/2 + 22);
  }
  if (game.state === 'over' || game.state === 'clear'){
    ctx.fillStyle = 'rgba(8,2,8,0.62)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = '800 34px "Zen Old Mincho","Shippori Mincho",serif';
    if (game.state === 'over'){
      ctx.fillStyle = '#ff5d6e';
      ctx.shadowColor = '#600'; ctx.shadowBlur = 14;
      ctx.fillText('GAME OVER', W/2, H/2 - 50);
    } else {
      ctx.fillStyle = '#ffd98a';
      ctx.shadowColor = '#c5283d'; ctx.shadowBlur = 14;
      ctx.fillText('紅い夜は明けた', W/2, H/2 - 50);
    }
    ctx.shadowBlur = 0;
    ctx.font = '15px "Shippori Mincho",serif';
    ctx.fillStyle = '#f2e3c2';
    ctx.fillText('SCORE  ' + game.score.toLocaleString(), W/2, H/2 - 8);
    ctx.fillText('GRAZE  ' + game.graze, W/2, H/2 + 18);
    if (Math.floor(game.frame / 36) % 2 === 0){
      ctx.font = '700 15px "Shippori Mincho",serif';
      ctx.fillStyle = '#fff';
      ctx.fillText('Z でもう一度', W/2, H/2 + 70);
    }
  }
}

/* ---------------- パネル更新 ---------------- */
const el = id => document.getElementById(id);
function updatePanel(){
  el('score').textContent = game.score.toLocaleString();
  el('hiscore').textContent = game.hiscore.toLocaleString();
  el('lives').textContent = '★'.repeat(Math.max(0, player.lives)) || '—';
  el('bombs').textContent = '✦'.repeat(Math.max(0, player.bombs)) || '—';
  el('power').textContent = player.power + ' / 8';
  el('graze').textContent = game.graze;
}

/* ---------------- リセット・ループ ---------------- */
function resetGame(start){
  game.hiscore = Math.max(game.hiscore, game.score);
  game.score = 0; game.graze = 0; game.stageT = 0;
  game.shake = 0; game.flash = 0; game.nextExtend = 0; game.slowmoT = 0;
  player.x = W/2; player.y = H - 80;
  player.lives = 2; player.bombs = 3; player.power = 0;
  player.inv = 120; player.respawn = 0; player.dead = false; player.bank = 0;
  pBullets = []; eBullets = []; enemies = []; items = []; particles = []; popups = [];
  boss = null; bombWave = null;
  buildStage();
  game.state = start ? 'play' : 'title';
}

let last = performance.now(), acc = 0;
function loop(now){
  requestAnimationFrame(loop);
  let dt = now - last; last = now;
  if (dt > 100) dt = 100;
  acc += dt;
  const step = game.slowmoT > 0 ? 1000/30 : 1000/60;
  let steps = 0;
  while (acc >= step && steps < 3){
    acc -= step; steps++;
    game.frame++;
    if (game.state === 'play') update();
  }
  // 描画
  ctx.save();
  if (game.shake > 0.5)
    ctx.translate(rand(-game.shake, game.shake), rand(-game.shake, game.shake));
  drawBG();
  drawItems();
  for (const e of enemies) drawEnemy(e);
  drawBoss();
  drawPlayer();
  drawBullets();
  drawParticles();
  drawHUD();
  ctx.restore();
  drawOverlay();
  updatePanel();
}
buildStage();
requestAnimationFrame(loop);
</script>
